<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Calendario Turni</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#D8D8DE;--fg:#0f172a;--mut:#5b6475;--btn:#003335}
@media (prefers-color-scheme: dark){:root{--bg:#020618;--fg:#f1f5f9;--mut:#94a3b8}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
main{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:340px}
.logo{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,0.18)}
h1{font-size:28px;line-height:34px;margin:6px 0 0;letter-spacing:-0.02em}
p{margin:0;font-size:17px;color:var(--mut)}
.spin{width:22px;height:22px;border:3px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:r 0.9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
a.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 24px;border-radius:14px;background:var(--btn);color:#fff;font-size:17px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <img class="logo" src="/icon-512.png" width="96" height="96" alt="">
  <h1>Calendario Turni</h1>
  <p>Sto aprendo l’app…</p>
  <div class="spin" aria-hidden="true"></div>
  <a class="btn" id="apri" href="https://turni-1-0.gabrielecavani.workers.dev">Apri Calendario Turni</a>
</main>
<script>
(function () {
  var DESTINAZIONE = "https://turni-1-0.gabrielecavani.workers.dev";
  var CHIAVE = "codice-dispositivo";
  var CHIAVE_OK = "codice-registrato";
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

  function vai() { location.replace(DESTINAZIONE); }

  function nuovoCodice() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var h = Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
  }

  var codice = null, giaRegistrato = false;
  try {
    codice = localStorage.getItem(CHIAVE);
    if (!codice || !UUID.test(codice)) {
      codice = nuovoCodice();
      localStorage.setItem(CHIAVE, codice);
      localStorage.removeItem(CHIAVE_OK);
    }
    giaRegistrato = localStorage.getItem(CHIAVE_OK) === "1";
  } catch (e) {
    codice = null; // memoria del telefono non disponibile: si apre l'app senza registrare
  }

  if (!codice || giaRegistrato || !window.fetch) { vai(); return; }

  var finito = false;
  function fine() { if (!finito) { finito = true; vai(); } }
  setTimeout(fine, 2500); // se la registrazione non risponde, si apre comunque l'app

  fetch("/api/registra", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ codice: codice }),
    keepalive: true
  }).then(function (r) {
    if (r.ok) { try { localStorage.setItem(CHIAVE_OK, "1"); } catch (e) {} }
  }).catch(function () {}).then(fine);
})();
</script>
</body>
</html>
